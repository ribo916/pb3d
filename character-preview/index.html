<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Character/Animation POC Viewer</title>
  <style>
    html, body { margin: 0; height: 100%; background: #1b1e24; color: #eee; font-family: system-ui, sans-serif; overflow: hidden; }
    #viewport { position: fixed; inset: 0; }
    #panel {
      position: fixed; top: 12px; left: 12px; z-index: 10;
      background: rgba(20, 22, 28, 0.85); border: 1px solid #444;
      border-radius: 8px; padding: 12px 14px; width: 300px;
      backdrop-filter: blur(4px);
    }
    #panel h1 { font-size: 14px; margin: 0 0 8px; font-weight: 600; color: #fff; }
    #panel .row { margin-bottom: 8px; }
    #panel label { display: block; font-size: 11px; color: #aaa; margin-bottom: 4px; }
    .clipButtons { display: flex; flex-wrap: wrap; gap: 6px; }
    .clipButtons button {
      flex: 1 1 auto; padding: 6px 8px; font-size: 12px; cursor: pointer;
      background: #2c313c; color: #eee; border: 1px solid #454b58; border-radius: 5px;
    }
    .clipButtons button.active { background: #3d7bd9; border-color: #3d7bd9; }
    .clipButtons button:hover { background: #3a4150; }
    .clipButtons button.active:hover { background: #4b86df; }
    .clipButtons button.loading { opacity: 0.6; cursor: wait; }
    .clipButtons button.error { background: #7a2f2f; border-color: #a33; }
    input[type="range"] { width: 100%; }
    #status { font-size: 11px; color: #9ad19a; white-space: pre-wrap; margin-top: 6px; }
    #status.error { color: #e08a8a; }
    #frameInfo { font-size: 11px; color: #ccc; margin-top: 4px; }
    button.toggle { width: 100%; padding: 6px; margin-top: 4px; }
  </style>
</head>
<body>
  <div id="viewport"></div>
  <div id="panel">
    <h1>Mixamo Characters — Tennis Swing Preview</h1>
    <div class="row">
      <label>Character</label>
      <div class="clipButtons" id="characterButtons"></div>
    </div>
    <div class="row">
      <label>Clip</label>
      <div class="clipButtons" id="clipButtons"></div>
    </div>
    <div class="row">
      <button class="toggle" id="playPause">Pause</button>
    </div>
    <div class="row">
      <label>Scrub (frame position within clip)</label>
      <input type="range" id="scrub" min="0" max="1" step="0.001" value="0" />
    </div>
    <div class="row">
      <label>Playback speed</label>
      <input type="range" id="speed" min="0.1" max="1.5" step="0.05" value="1" />
    </div>
    <div id="frameInfo">–</div>
    <div id="status">Loading…</div>
  </div>
  <script type="module" src="./main.js"></script>
</body>
</html>
